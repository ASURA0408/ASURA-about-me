<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASURA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #111, #333);
      color: white;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid red;
      box-shadow: 0 0 30px red;
      animation: pulse 2s infinite;
    }

    .icon-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px red; }
      50% { transform: scale(1.05); box-shadow: 0 0 30px red; }
      100% { transform: scale(1); box-shadow: 0 0 10px red; }
    }

    .asura-text {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 2.5rem;
      color: red;
      font-weight: bold;
      text-shadow: 0 0 10px red;
      animation: fadeIn 3s ease-in-out infinite;
    }

    @keyframes fadeIn {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @media (max-width: 600px) {
      .icon-circle {
        width: 120px;
        height: 120px;
      }
      .asura-text {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="icon-circle">
    <img src="redgundom.jpg" alt="Red Gundam Icon" />
  </div>

  <div class="asura-text">ASURA</div>

</body>
</html>
