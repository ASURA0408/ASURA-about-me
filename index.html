<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASURA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    /* 宇宙背景の星 */
    .stars, .stars2, .stars3 {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-repeat: repeat;
      background-size: contain;
      animation: moveStars 200s linear infinite;
    }

    .stars {
      background-image: url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars.png');
      z-index: 0;
      opacity: 0.6;
    }

    .stars2 {
      background-image: url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars2.png');
      z-index: 1;
      animation-duration: 300s;
      opacity: 0.4;
    }

    .stars3 {
      background-image: url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars3.png');
      z-index: 2;
      animation-duration: 400s;
      opacity: 0.2;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: -10000px 5000px; }
    }

    .icon-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid red;
      box-shadow: 0 0 30px red;
      animation: pulse 2s infinite;
      z-index: 5;
    }

    .icon-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px red; }
      50% { transform: scale(1.05); box-shadow: 0 0 30px red; }
      100% { transform: scale(1); box-shadow: 0 0 10px red; }
    }

    .asura-text {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 2.5rem;
      color: red;
      font-weight: bold;
      text-shadow: 0 0 10px red;
      animation: fadeIn 3s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes fadeIn {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @media (max-width: 600px) {
      .icon-circle {
        width: 120px;
        height: 120px;
      }
      .asura-text {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- 背景の星 -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <!-- 中央のアイコン -->
  <div class="icon-circle">
    <img src="redgundom.jpg" alt="Red Gundam Icon" />
  </div>

  <!-- ASURA のテキスト -->
  <div class="asura-text">ASURA</div>

</body>
</html>
